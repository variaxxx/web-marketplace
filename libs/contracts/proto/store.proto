syntax = "proto3";

package store.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "auth.proto";
import "user.proto";

service StoreService {
  rpc GetInfo (GetStoreInfoPayload) returns (StoreInfoResponse);
  rpc EditInfo (EditStoreInfoPayload) returns (StoreEditRequestResponse);
  rpc EditInfoImmediate (EditStoreInfoPayload) returns (StoreInfoResponse);
}

service StoreModerationService {
  rpc CancelEdit (CancelStoreEditPayload) returns (StoreEditRequestResponse);
  rpc ApproveEdit (ApproveStoreEditPayload) returns (StoreEditRequestResponse);
  rpc RejectEdit (RejectStoreEditPayload) returns (google.protobuf.Empty);

  rpc GetEditRequest (GetStoreEditRequestPayload) returns (StoreEditRequestResponse);
  rpc GetEditRequests (GetStoreEditRequestsPayload) returns (StoreEditRequestsResponse);
}

// === SHARED ===

message ValueChange {
  enum OperationType {
    SET = 0;
    CLEAR = 1;
  }

  OperationType type = 1;
  string field_name = 2;
  optional string new_value = 3;
  optional string old_value = 4;
}

// === REQUESTS ===

message GetStoreInfoPayload {
  optional string store_id = 1;
  optional string owner_id = 2;
}
message EditStoreInfoPayload {
  repeated ValueChange changes = 1;
  optional string store_id = 2;

  auth.v1.UserInfo user_info = 6;
}

message GetStoreEditRequestPayload {
  string request_id = 1;
  auth.v1.UserInfo user_info = 2;
}

message GetStoreEditRequestsPayload {
  optional string owner_id = 1;
  optional int32 limit = 2;
  optional int32 offset = 3;

  auth.v1.UserInfo user_info = 4;
}

message CancelStoreEditPayload {
  string request_id = 1;
  auth.v1.UserInfo user_info = 2;
}

message ApproveStoreEditPayload {
  string request_id = 1;
  auth.v1.UserInfo user_info = 2;
}

message RejectStoreEditPayload {
  string request_id = 1;
  auth.v1.UserInfo user_info = 2;
}

// === RESPONSES ===

message StoreInfoResponse {
  string id = 1;
  string name = 2;
  string description = 3;
  optional string avatar_url = 4;
}

message StoreEditRequestResponse {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  StoreEditRequestStatus status = 3;
  string store_id = 4;
  repeated ValueChange changes = 5;
  optional google.protobuf.Timestamp decision_made_at = 6;
  optional user.v1.UserDisplayInfo reviewed_by = 7;
}

message StoreEditRequestsResponse {
  int32 total = 1;
  int32 count = 2;
  repeated StoreEditRequestResponse items = 3;
}

// === ENUMS ===

enum StoreEditRequestStatus {
  UNSPECIFIED = 0;
  PENDING = 1;
  APPROVED = 2;
  REJECTED = 3;
  CANCELLED = 4;
}
