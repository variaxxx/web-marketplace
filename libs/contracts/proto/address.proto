syntax = "proto3";

package address.v1;

import "auth.proto";
import "google/protobuf/timestamp.proto";

service AddressService {
  rpc Add (AddAddressPayload) returns (AddressInfoResponse);
  rpc Edit (EditAddressPayload) returns (AddressInfoResponse);
  rpc Delete (DeleteAddressPayload) returns (AddressInfoResponse);
  rpc FindOne (FindOneAddressPayload) returns (AddressInfoResponse);
  rpc FindMany (FindManyAddressesPayload) returns (FindManyAddressesResponse);
}

message AddAddressPayload {
  string city = 1;
  string street = 2;
  string house = 3;
  double latitude = 4;
  double longitude = 5;
  optional string label = 6;

  auth.v1.UserInfo user_info = 7;
}

message EditAddressPayload {
  string address_id = 1;
  optional string city = 2;
  optional string street = 3;
  optional string house = 4;
  optional double latitude = 5;
  optional double longitude = 6;
  optional string label = 7;

  auth.v1.UserInfo user_info = 8;
}

message DeleteAddressPayload {
  string address_id = 1;

  auth.v1.UserInfo user_info = 2;
}

message FindOneAddressPayload {
  string address_id = 1;

  auth.v1.UserInfo user_info = 2;
}

message FindManyAddressesPayload {
  optional int32 limit = 1;
  optional int32 offset = 2;

  auth.v1.UserInfo user_info = 3;
}

message AddressInfoResponse {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  string city = 3;
  string street = 4;
  string house = 5;
  double latitude = 6;
  double longitude = 7;
  optional string label = 8;
}

message FindManyAddressesResponse {
  int32 total = 1;
  int32 count = 2;
  repeated AddressInfoResponse items = 3;
}
